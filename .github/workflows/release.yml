# Builds the app for macOS and Windows and attaches both to a GitHub release.
#
# The download button on the landing page points at this repository's latest
# release, and every copy of the app asks that same release whether it is out
# of date, so a tag pushed here is what reaches the churches.
#
# Run by hand (workflow_dispatch) it builds both and keeps them as artifacts,
# without publishing anything.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The app compares its own version with the release's tag to decide
      # whether to offer an update. A tag that says 1.0.2 on a build that says
      # 1.0.1 would offer every church, forever, an update it already has.
      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec=$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          code=$(grep -o "appVersion = '[^']*'" lib/core/config/app_version.dart | cut -d"'" -f2)
          if [ "$tag" != "$pubspec" ] || [ "$tag" != "$code" ]; then
            echo "Tag $tag, pubspec.yaml $pubspec, app_version.dart $code: all three must match." >&2
            exit 1
          fi

      # Pinned, not "latest stable": a Flutter release can deprecate a widget
      # API overnight, and the first anyone would hear of it is a red build on
      # a commit that touched nothing related. Raise it deliberately, with the
      # deprecations fixed in the same change.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      # Not a secret - it is the public address of the API, and every copy of
      # the app has to know it. It is out of the repository because which API a
      # build talks to is a deployment decision.
      - name: Write .env
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "Set the API_URL repository variable (Settings → Secrets and variables → Actions → Variables)." >&2
            exit 1
          fi
          echo "API_URL=${{ vars.API_URL }}" > .env

      - run: flutter pub get

      # Ship nothing that does not pass. A broken release is worse than a late
      # one when the people installing it are volunteers.
      - run: flutter analyze
      - run: flutter test

      - run: flutter build macos --release

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd build/macos/Build/Products/Release
          # --symlinks, or the frameworks inside the bundle are copied rather
          # than linked and macOS refuses to open it.
          zip -r --symlinks "$GITHUB_WORKSPACE/Introduce-macOS-${version}.zip" Introduce.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Introduce-macOS-*.zip

  # Published as a beta. The Mac release does not wait for it to succeed.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Write .env
        shell: bash
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "Set the API_URL repository variable." >&2
            exit 1
          fi
          echo "API_URL=${{ vars.API_URL }}" > .env

      - run: flutter pub get
      - run: flutter build windows --release

      # One folder named Introduce, so unzipping gives a folder to keep and,
      # later, to replace. The Visual C++ runtime goes inside it: Flutter does
      # not ship it, and a computer that never installed it would refuse to
      # start the app with an error about a missing DLL.
      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          New-Item -ItemType Directory -Path dist/Introduce | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist/Introduce/
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" dist/Introduce/
          }
          Compress-Archive -Path dist/Introduce -DestinationPath "Introduce-Windows-$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Introduce-Windows-*.zip

  publish:
    needs: [macos, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          cat > NOTES.md <<'NOTES'
          ## Instalar en Mac

          1. Descargar `Introduce-macOS-….zip` y descomprimirlo.
          2. Arrastrar `Introduce.app` a Aplicaciones.
          3. Abrirla. macOS avisa que no puede verificarla: **Listo**.
          4. **Ajustes del Sistema → Privacidad y seguridad**, bajar hasta el
             aviso sobre Introduce y pulsar **Abrir igualmente**.

          Los pasos 3 y 4 hacen falta una sola vez, porque la app todavía no
          está firmada con un certificado de Apple. En macOS 14 o anterior
          también sirve clic derecho sobre la app, **Abrir**, **Abrir**.

          Apple Silicon e Intel, macOS 12 o superior.

          Si ya tienes Introduce, reemplaza la app en Aplicaciones por la nueva.
          Los servicios, los diseños y la sesión se quedan como están.
          NOTES

          if ls dist/Introduce-Windows-*.zip >/dev/null 2>&1; then
            cat >> NOTES.md <<'NOTES'

          ## Windows (beta)

          Si algo no funciona, cuéntanos en
          [Issues](https://github.com/steven230500/introduce-church/issues).

          1. Descargar `Introduce-Windows-….zip` y descomprimirlo.
          2. Abrir la carpeta `Introduce` y ejecutar `Introduce.exe`.
          3. Si Windows avisa que protegió tu PC: **Más información →
             Ejecutar de todas formas**. La app todavía no está firmada.

          Windows 10 u 11, 64 bits.
          NOTES
          fi

          cat >> NOTES.md <<'NOTES'

          ## Installing

          **Mac:** unzip, drag `Introduce.app` to Applications and open it. When
          macOS says it cannot verify the app, go to **System Settings → Privacy &
          Security** and click **Open Anyway**. Only the first time: the app is
          not signed with an Apple certificate yet.
          NOTES

          if ls dist/Introduce-Windows-*.zip >/dev/null 2>&1; then
            cat >> NOTES.md <<'NOTES'

          **Windows (beta):** unzip and run
          `Introduce.exe` inside the `Introduce` folder. If Windows says it
          protected your PC, click **More info → Run anyway**.
          NOTES
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Introduce ${GITHUB_REF_NAME}" \
            --notes-file NOTES.md
